<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#662720" />

    <!--
      These defaults exist for crawlers and link-preview bots that read raw HTML and do
      not run JavaScript. Once React mounts, `useDocumentMeta` replaces them with whatever
      the admin has configured in Firestore.
    -->
    <title>John Williams Math Tutoring | Algebra, Geometry &amp; More</title>
    <meta
      name="description"
      content="One-on-one math tutoring for middle school and high school students — Algebra 1, Geometry, Algebra 2 and all middle school math. Flexible evening and weekend scheduling."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="John Williams Math Tutoring" />
    <meta property="og:title" content="John Williams Math Tutoring" />
    <meta
      property="og:description"
      content="One-on-one math tutoring for middle school and high school students. Book a session online."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      Google Fonts: preconnect to both hosts. The stylesheet comes from fonts.googleapis.com
      but the font files come from fonts.gstatic.com, and only preconnecting to the first
      leaves the second connection to be negotiated when the CSS is already parsed.
      `crossorigin` is required on the gstatic hint or the connection is not reused.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Titan+One&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>JavaScript is required</h1>
        <p>
          This site needs JavaScript to show availability and take bookings. Please enable
          it, or call or text to book a session directly.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
